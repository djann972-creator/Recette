<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Recettes en famille</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : appli à deux onglets (Plats / Courses). Fiche plat = régime + nombre de personnes + ingrédients recalculés. Liste de courses rangée par rayon. */
:root{
  --bg:#F6F8F3; --surface:#FFFFFF; --ink:#1B271F; --muted:#5B6B60; --line:#DCE3D6;
  --accent:#1E6A49; --accent-ink:#FFFFFF; --accent-soft:#DDEDE3;
  --spice:#C9820F; --spice-soft:#FBEED5; --danger:#B3402E;
  --plate:#FFFFFF; --plate-rim:#EDF1E9; --band:#1E6A49; --band-ink:#FFFFFF; --band-soft:#F4C766;
  --f-display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#19221C; --ink:#E6EEE7; --muted:#9BAB9F; --line:#2A362E;
  --accent:#62C597; --accent-ink:#0C1A12; --accent-soft:#1F3328;
  --spice:#EDB04C; --spice-soft:#36290F; --danger:#E7826F;
  --plate:#2B372F; --plate-rim:#222C25; --band:#1D3B2C; --band-ink:#EAF4EC; --band-soft:#EDB04C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#19221C; --ink:#E6EEE7; --muted:#9BAB9F; --line:#2A362E;
  --accent:#62C597; --accent-ink:#0C1A12; --accent-soft:#1F3328;
  --spice:#EDB04C; --spice-soft:#36290F; --danger:#E7826F;
  --plate:#2B372F; --plate-rim:#222C25; --band:#1D3B2C; --band-ink:#EAF4EC; --band-soft:#EDB04C; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--spice);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.back{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 14px;font-weight:700}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sect{padding-block:18px 4px;display:flex;flex-direction:column;gap:10px}

/* Filtre de régime */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.92rem;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font-weight:400;opacity:.7;font-variant-numeric:tabular-nums}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--reg);margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}

/* Bandeau d'accueil */
.welcome{margin-top:14px;background:var(--band);color:var(--band-ink);border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.welcome h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;max-width:14ch}
.welcome p{margin:0;opacity:.9}
.welcome .sun{position:absolute;right:-28px;top:-28px;width:120px;height:120px;border-radius:50%;background:var(--band-soft);opacity:.9}
.welcome .sun::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--band);opacity:.25}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:11px 16px;font:inherit}

/* Grille des plats */
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-block:6px 10px}
.plat{text-align:left;border:0;background:color-mix(in srgb,var(--dish) 17%,var(--surface));border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.plat .plate{width:72px;height:72px;margin-bottom:6px}
.plat h2{font-size:1.12rem;font-weight:800}
.plat .orig{font-size:.85rem;color:var(--muted)}
.plat .tag{align-self:flex-start;margin-top:6px;font-size:.78rem;font-weight:700;background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px}
.plat .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--reg)}
.none{color:var(--muted);padding-block:8px;grid-column:1/-1;margin:0}

/* Fiche plat */
.hero{margin-top:14px;background:color-mix(in srgb,var(--dish) 20%,var(--surface));border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:16px}
.hero .plate{width:96px;height:96px;flex:none}
.hero div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero h2{font-size:1.8rem;font-weight:800;letter-spacing:-.02em}
.hero .orig{color:var(--muted)}
.persons{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
.persons .lbl{flex:1;font-weight:700}
.step{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:1.4rem;font-weight:700;line-height:1}
.persons output{font-family:var(--f-display);font-size:1.6rem;font-weight:800;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px}
.ing{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing span:first-child{min-width:0}
.qty{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ray{font-size:.78rem;color:var(--muted);display:block}
.note{background:var(--spice-soft);border-radius:var(--radius);padding:12px 14px}
.note p{margin:4px 0 0}
.cta{width:100%;border:0;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;padding:15px}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.ghost.danger{color:var(--danger);border-color:var(--danger)}

/* Liste de courses */
.meals{display:flex;flex-wrap:wrap;gap:8px}
.meal{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:.9rem}
.meal button{border:0;background:var(--accent-soft);color:var(--accent);width:26px;height:26px;border-radius:50%;font-weight:700}
.rayon h3{font-size:1.05rem;font-weight:700;padding-block:6px 2px}
.item{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.item label{flex:1;min-width:0;display:flex;justify-content:space-between;gap:10px}
.item.done label{color:var(--muted);text-decoration:line-through}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:.85rem;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:22px 16px;text-align:center;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--spice-soft);border-radius:var(--radius);padding:10px 12px}
textarea.copy{width:100%;min-height:180px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:10px}

/* Ajout d'une recette */
.addtile{border:2px dashed var(--line);background:transparent;border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;min-height:150px;text-align:left;color:var(--accent);font-weight:700}
.addtile .plus{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:1.6rem;line-height:1}
.addtile small{color:var(--muted);font-weight:400}
.form{display:flex;flex-direction:column;gap:8px}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit}
textarea.field{min-height:220px;resize:vertical}
input.field[type=number]{max-width:120px}
.lead{margin:0;color:var(--ink)}
.warn{background:var(--spice-soft);border-left:4px solid var(--spice);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:0}
.err{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--ink);border-radius:10px;padding:10px 12px;margin:0}
.adapt{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.adapt p{margin:0;color:var(--muted)}
.busy{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px}
.busy span{flex:1}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.plat .mine{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* Allergies */
.algbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
.algbar strong{font-size:.95rem}
.algpanel{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.check{display:flex;align-items:center;gap:10px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.plat .tag.bad{background:color-mix(in srgb,var(--danger) 16%,var(--surface));color:var(--ink);margin-top:2px}
.plat .tag.bad::before{background:var(--danger)}
.danger{background:color-mix(in srgb,var(--danger) 13%,var(--surface));border-left:4px solid var(--danger);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.danger p{margin:0;font-size:.92rem}
.okbox{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:0;font-size:.92rem}
.ing.alrg span:first-child{color:var(--danger);font-weight:700}
.ing.alrg .ray{color:var(--danger)}

.avis{display:block;text-align:center;border:2px solid var(--accent);color:var(--accent);border-radius:var(--radius);padding:13px;font-weight:700;text-decoration:none}
.avis:hover{background:var(--accent-soft)}

/* Onglets du bas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;max-width:220px;border:0;background:transparent;border-radius:12px;padding:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.badge{background:var(--spice);color:#1B1408;border-radius:999px;font-size:.75rem;padding:1px 7px;min-width:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);z-index:20}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.6}}}
</style>

function ingAlg(entry){
  const [n] = entry;
  if (ING_ALG[n]) return ING_ALG[n];

  if (KNOWN_SET.has(n)) return [];
  const t = norm(n).replace(/œ/g, "oe");
  const found = ALG_KEYS.filter(k => ALG_RX[k].test(t) && !(k === "gluten" && /sans gluten/.test(t)));
  const fromClaude = Array.isArray(entry[4]) ? entry[4].filter(k => ALG_KEYS.includes(k)) : [];
  return [...new Set([...found, ...fromClaude])];
}

const validColor = (c, d) => /^#[0-9A-Fa-f]{6}$/.test(c || "") ? c : d;
function cleanVersion(v){
  if (!v || typeof v !== "object") return null;
  const raw = Array.isArray(v.g) ? v.g : (Array.isArray(v.ingredients) ? v.ingredients : []);
  const g = [];
  for (const x of raw){
    if (!Array.isArray(x)) continue;
    let [n, q, u, ray] = x;
    n = String(n || "").trim().slice(0, 60); q = Number(q); u = String(u || "").trim().toLowerCase();
    if (["piece","pieces","pièces","pc","unité","unités"].includes(u)) u = "pièce";
    if (!n || !(q > 0) || !UNITS.includes(u)) continue;
    const al = Array.isArray(x[4]) ? x[4].filter(k => ALG_KEYS.includes(k)) : [];
    g.push([n, Math.round(q * 100) / 100, u, RAYONS.includes(ray) ? ray : "Épicerie", al]);
  }
  if (!g.length) return null;
  return { t: String(v.t ?? v.resume ?? "").slice(0, 300), i: String(v.i ?? v.instruction ?? "").slice(0, 700),
           c: String(v.c ?? v.conseil ?? "").slice(0, 300), g, auto: v.auto !== false };
}
function cleanCustom(id, d){
  if (!d || typeof d !== "object") return null;
  const versions = {};
  for (const reg of REGIMES){ const cv = cleanVersion(d.versions && d.versions[reg]); if (cv) versions[reg] = cv; }
  if (!Object.keys(versions).length) return null;
  return { id: String(id), nom: String(d.nom || "Ma recette").slice(0, 80), origine: String(d.origine || "").slice(0, 60),
           c1: validColor(d.c1, "#3F9A8C"), c2: validColor(d.c2, "#F2C14E"), cat: CATS.includes(d.cat) ? d.cat : "Plat", versions, cree: Number(d.cree) || 0 };
}

function deleteCustom(id){
  const c = customs.find(x => x.id === id); if (!c) return;
  const dead = store.meals.filter(m => m.rid.startsWith("u:" + id + ":")).map(m => m.id);
  if (dead.length){
    store.meals = store.meals.filter(m => !dead.includes(m.id));
    const ch = {}; for (const k in store.checked) if (!dead.some(d => k.startsWith(d + "|"))) ch[k] = true;
    store.checked = ch; persist();
  }
  if (c.local){ customsLocal = customsLocal.filter(x => x.id !== id); lsSet("mesrecettes", customsLocal); remerge(); return; }
  customsDb = customsDb.filter(x => x.id !== id); remerge();
  if (recCol) recWriting = recWriting.then(() => recCol.doc(id).delete()).catch(() => toast("La recette n'a pas pu être supprimée."));
}

const nf1 = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2});
function fmt(q, u, buying){
  if (u === "pièce"){ const n = buying ? Math.ceil(q - 1e-9) : q; return (buying ? n : nf2.format(n)) + (n > 1 ? " pièces" : " pièce"); }
  if (u === "g"){ if (q >= 1000) return nf1.format(q/1000) + " kg"; if (q >= 100) return Math.round(q/10)*10 + " g"; if (q >= 10) return Math.round(q) + " g"; return nf1.format(q) + " g"; }
  if (u === "cl"){ if (q >= 100) return nf1.format(q/100) + " L"; return nf1.format(q) + " cl"; }
  if (u === "ml"){ if (q >= 1000) return nf1.format(q/1000) + " L"; return Math.round(q) + " ml"; }
  return nf1.format(q) + " " + u;
}
function shopping(){
  const m = new Map();
  for (const meal of store.meals){
    const r = getRec(meal.rid); if (!r) continue;
    for (const [n,q,u,ray] of r.g){
      const k = n + "|" + u;
      const e = m.get(k) || {k, n, u, ray, q:0, parts:[]};
      e.q += q * meal.n; e.parts.push(meal.id + "|" + k); m.set(k, e);
    }
  }
  return [...m.values()];
}
/* Une case cochée = un ingrédient d'un repas. Vue par rayon : coché si tous les repas qui l'utilisent le sont. */
const isDone = parts => parts.length > 0 && parts.every(p => store.checked[p]);
const rayIdx = r => { const i = RAYONS.indexOf(r); return i < 0 ? 99 : i; };
const sortRay = (a, b) => rayIdx(a.ray) - rayIdx(b.ray) || a.n.localeCompare(b.n, "fr");
function mealItems(meal){
  const r = getRec(meal.rid); if (!r) return [];
  return r.g.map(([n,q,u,ray]) => { const k = n + "|" + u; return {n, u, ray, q: q * meal.n, parts:[meal.id + "|" + k]}; }).sort(sortRay);
}
function mealTitle(meal){
  const r = getRec(meal.rid); if (!r) return "Recette supprimée";
  const p = platInfo(r.p); return (p ? p[1] : "Recette") + " · " + regLabel(r.r) + " · " + meal.n + " pers.";
}
function itemRow(i, cid){
  const done = isDone(i.parts);
  return `<div class="item${done?" done":""}"><input type="checkbox" id="${cid}" data-chk="${esc(i.parts.join("¦"))}" ${done?"checked":""}><label for="${cid}"><span>${esc(i.n)}${state.vue==="recette" ? `<span class="ray">${esc(i.ray)}</span>` : ""}</span><span class="qty">${fmt(i.q,i.u,true)}</span></label></div>`;
}

/* ---------- rendu ---------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function updateChrome(){
  document.getElementById("tab-plats").setAttribute("aria-current", state.view !== "liste" ? "page" : "false");
  document.getElementById("tab-liste").setAttribute("aria-current", state.view === "liste" ? "page" : "false");
  const b = document.getElementById("badge"); b.textContent = store.meals.length; b.hidden = !store.meals.length;
}
/* Une mise à jour venue d'ailleurs ne doit pas effacer un formulaire en cours de saisie. */
function softRender(){ if (state.view === "ajout") return updateChrome(); render(); }
function render(){
  updateChrome();
  if (state.view === "plat") return renderPlat();
  if (state.view === "liste") return renderListe();
  if (state.view === "ajout") return renderAjout();
  renderPlats();
}
function regimeChips(attr = "data-reg", current = state.regime){
  return `<div class="chips" role="group" aria-label="Régime">${REGIMES.map(r =>
    `<button class="chip" type="button" ${attr}="${esc(r)}" aria-pressed="${r===current}" style="--reg:${REG_COLOR[r]}"><span class="dot"></span>${esc(regLabel(r))}</button>`).join("")}</div>`;
}
function catChips(attr, current, withAll){
  const all = allPlats(); const count = c => all.filter(p => catOf(p) === c).length;
  return `<div class="chips" role="group" aria-label="Catégorie">${(withAll ? ["Tout", ...CATS] : CATS).map(c =>
    `<button class="chip" type="button" ${attr}="${esc(c)}" aria-pressed="${c===current}">${esc(c)}${withAll ? ` <span class="n">${c === "Tout" ? all.length : count(c)}</span>` : ""}</button>`).join("")}</div>`;
}

function platTiles(){
  const q = norm(state.q || "");
  const list = allPlats().map((p,i) => [p,i]).filter(([p]) => (state.cat === "Tout" || catOf(p) === state.cat) && (!q || norm(p[1] + " " + p[2] + " " + catOf(p)).includes(q)));
  const add = `<button class="addtile" type="button" data-act="new"><span class="plus" aria-hidden="true">+</span>Ajouter une recette<small>Colle une recette d'Internet, Claude l'adapte à ton régime</small></button>`;
  if (!list.length) return `<p class="none">${state.q ? `Aucune recette ne correspond à « ${esc(state.q)} »` : `Pas encore de recette dans « ${esc(state.cat)} »`}${state.cat !== "Tout" && state.q ? ` dans « ${esc(state.cat)} »` : ""}. Ajoute la première :</p>` + add;
  return list.map(([[k,name,orig,c1,c2],i]) => {
    const custom = k.startsWith("u:");
    const rec = custom ? getRec(k + ":" + state.regime) : R[byPlat[k][state.regime]];
    const has = !custom || rec;
    const hits = has ? algHits(rec) : [];
    if (hits.length && state.hideAlg) return "";
    return `
      <button class="plat" type="button" data-plat="${esc(k)}" style="--dish:${c1};--reg:${has ? REG_COLOR[state.regime] : "transparent"}">
        ${plate(c1,c2,i)}
        ${custom ? `<span class="mine">${(customs.find(x => "u:" + x.id === k) || {}).local || isAdmin ? "Ma recette" : "Recette ajoutée"}</span>` : ""}
        <h2>${esc(name)}</h2><span class="orig">${esc(orig)}</span>
        <span class="tag">${has ? esc(regLabel(state.regime)) : "À adapter"}</span>
        ${hits.length ? `<span class="tag bad">Contient : ${esc(algList(hits))}</span>` : ""}
      </button>`; }).join("") + add;
}
function allergyPanel(){
  const a = state.allergies;
  const head = `<div class="algbar"><span><span class="eyebrow">Allergies</span><br><strong>${a.length ? "Sans " + esc(algList(a)) : "Aucune allergie indiquée"}</strong></span>
    <button class="ghost" type="button" data-act="alg-open" aria-expanded="${state.algOpen}">${state.algOpen ? "Fermer" : a.length ? "Modifier" : "Indiquer"}</button></div>`;
  if (!state.algOpen) return head;
  return head + `<div class="algpanel">
    <div class="chips" role="group" aria-label="Allergènes">${ALG_KEYS.map(k => `<button class="chip" type="button" data-alg="${k}" aria-pressed="${a.includes(k)}">${esc(ALG[k])}</button>`).join("")}</div>
    <label class="check"><input type="checkbox" id="hide-alg" ${state.hideAlg ? "checked" : ""}> Masquer les recettes qui en contiennent</label>
    <p class="status">« Lait » couvre aussi l'allergie aux protéines de lait : un produit « sans lactose » en contient toujours. L'appli repère les allergènes à partir des noms d'ingrédients : vérifie toujours les étiquettes, y compris « peut contenir des traces de… ».</p>
  </div>`;
}
function renderPlats(){
  app.innerHTML = `
    <header class="welcome"><span class="sun" aria-hidden="true"></span><span class="eyebrow" style="color:inherit;opacity:.85">Recettes en famille</span>
      <h1>Qu'est-ce qu'on mange ?</h1><p>${allPlats().length} recettes. Choisis pour qui tu cuisines, puis une recette.</p></header>
    <section class="sect"><span class="eyebrow">Pour qui on cuisine ?</span>${regimeChips()}</section>
    <section class="sect">${allergyPanel()}</section>
    <section class="sect"><span class="eyebrow">Catégorie</span>${catChips("data-cat", state.cat, true)}</section>
    <section class="sect"><label class="eyebrow" for="q">Chercher une recette</label>
      <input class="search" id="q" type="search" placeholder="Colombo, quiche, Antilles…" value="${esc(state.q || "")}" autocomplete="off"></section>
    <section class="plats" id="grid" aria-label="Plats">${platTiles()}</section>`;
}
function busyBox(msg){
  return `<div class="busy" role="status"><span class="spin" aria-hidden="true"></span><span>${msg}</span><button class="ghost" type="button" data-act="stop">Arrêter</button></div>`;
}
function renderPlat(){
  const plats = allPlats(); const idx = plats.findIndex(p => p[0] === state.plat);
  if (idx < 0){ state.view = "plats"; return renderPlats(); }
  const [k,name,orig,c1,c2] = plats[idx]; const cat = catOf(plats[idx]);
  const custom = k.startsWith("u:");
  const rid = custom ? k + ":" + state.regime : byPlat[k][state.regime];
  const r = getRec(rid); const n = state.persons;
  const err = state.err ? `<p class="err" role="alert">${esc(state.err)}</p>` : "";
  let body;
  if (!r){
    body = `<section class="sect"><div class="adapt">
        <strong>Pas encore de version « ${esc(regLabel(state.regime))} » pour ce plat.</strong>
        <p>Claude peut l'adapter à partir de la recette d'origine. Ça prend jusqu'à une minute.</p>
        ${state.busy ? busyBox("Claude adapte la recette…") : `<button class="cta" type="button" data-act="adapt"${sampleKnown === "none" ? " disabled" : ""}>Adapter avec Claude</button>`}
        ${sampleKnown === "none" ? `<p>${NO_CLAUDE}</p>` : ""}${err}
      </div></section>`;
  } else {
    const warn = r.auto ? `<p class="warn">${r.r === "Standard" ? "Recette importée par Claude : vérifie les quantités." : "Adaptation automatique par Claude, non vérifiée par une diététicienne. En cas d'allergie, vérifie toujours les étiquettes."}</p>` : "";
    const hits = algHits(r);
    const algBox = !state.allergies.length ? "" : hits.length
      ? `<div class="danger" role="alert"><strong>Attention : cette version contient ${esc(algList(hits))}.</strong>
          <p>${hits.map(k => esc(ALG[k]) + " : " + esc(r.g.filter(x => ingAlg(x).includes(k)).map(x => x[0]).join(", "))).join("<br>")}</p>
          ${state.busy ? busyBox("Claude adapte la recette à tes allergies…") : `<button class="cta" type="button" data-act="alg-adapt"${sampleKnown === "none" ? " disabled" : ""}>Adapter à mes allergies avec Claude</button>`}
          ${sampleKnown === "none" ? `<p>${NO_CLAUDE}</p>` : ""}${err}</div>`
      : `<p class="okbox">Aucun de tes allergènes (${esc(algList(state.allergies))}) dans les ingrédients. Vérifie quand même les étiquettes.</p>`;
    body = `
    <section class="sect">${algBox}</section>
    <section class="sect">
      <div class="persons"><span class="lbl">Nombre de personnes</span>
        <button class="step" type="button" data-step="-1" aria-label="Une personne de moins">−</button>
        <output aria-live="polite">${n}</output>
        <button class="step" type="button" data-step="1" aria-label="Une personne de plus">+</button></div>
      ${warn}
    </section>
    <section class="sect"><span class="eyebrow">Ingrédients pour ${n} ${n>1?"personnes":"personne"}</span>
      <div class="card">${r.g.map(x => { const [nm,q,u,ray] = x; const bad = ingAlg(x).filter(k => state.allergies.includes(k));
        return `<div class="ing${bad.length ? " alrg" : ""}"><span>${esc(nm)}<span class="ray">${bad.length ? "Contient : " + esc(algList(bad)) : esc(ray)}</span></span><span class="qty">${fmt(q*n,u,false)}</span></div>`; }).join("")}</div>
      <span class="status">Sel, poivre, huile de cuisson et eau ne sont pas comptés.</span>
    </section>
    <section class="sect"><span class="eyebrow">Comment faire</span>
      <div class="note"><strong>${esc(r.i)}</strong>${r.c ? `<p>${esc(r.c)}</p>` : ""}</div>
    </section>
    <section class="sect"><button class="cta" type="button" data-add="${esc(rid)}">Ajouter à la liste de courses</button>
      <a class="avis" href="${esc(avisLink(name, state.regime))}" target="_blank" rel="noopener">Tu l'as cuisinée ? Donne ton avis</a>
      <span class="status">Ouvre le formulaire d'avis, avec la recette et la version déjà remplies.</span></section>`;
  }
  const del = custom && canDelete(customs.find(x => "u:" + x.id === k)) ? `<section class="sect"><div class="bar">
      ${state.confirmDel ? `<div class="confirm"><span>Supprimer « ${esc(name)} » et toutes ses versions ?</span><button class="ghost danger" type="button" data-act="del-yes">Oui, supprimer</button><button class="ghost" type="button" data-act="del-no">Annuler</button></div>`
        : `<button class="ghost danger" type="button" data-act="del">Supprimer cette recette</button>`}</div></section>` : "";
  app.innerHTML = `
    <header class="top"><button class="back" type="button" data-go="plats">← Recettes</button><h1>${esc(name)}</h1></header>
    <section class="hero" style="--dish:${c1}">${plate(c1,c2,idx)}<div><span class="eyebrow">${esc(cat)} · ${esc(orig)}</span><h2>${esc(regLabel(state.regime))}</h2></div></section>
    <section class="sect">${regimeChips()}
      ${/Sans Lactose/.test(state.regime) ? `<span class="status">« Sans lactose » ne convient pas à une allergie aux protéines de lait : coche « Lait » dans tes allergies, sur l'accueil.</span>` : ""}</section>
    ${body}${del}`;
}
function renderAjout(){
  const d = state.draft;
  const err = state.err ? `<p class="err" role="alert">${esc(state.err)}</p>` : "";
  app.innerHTML = `
    <header class="top"><button class="back" type="button" data-go="plats">← Recettes</button><h1>Ajouter une recette</h1></header>
    <section class="sect"><p class="lead">Colle une recette trouvée sur Internet : les ingrédients et les étapes. Claude la range dans l'appli, calcule les quantités par personne et l'adapte au régime choisi.</p>
      ${sampleKnown === "none" ? `<p class="warn">${NO_CLAUDE}</p>` : ""}</section>
    <section class="sect form">
      <label class="eyebrow" for="f-nom">Nom du plat (facultatif)</label>
      <input class="field" id="f-nom" type="text" maxlength="80" placeholder="Ex. : Poulet yassa" value="${esc(d.nom)}">
      <label class="eyebrow" for="f-texte">Texte de la recette</label>
      <textarea class="field" id="f-texte" placeholder="Ingrédients : …&#10;Préparation : …">${esc(d.texte)}</textarea>
      <label class="eyebrow" for="f-pers">La recette est prévue pour combien de personnes ?</label>
      <input class="field" id="f-pers" type="number" min="1" max="30" inputmode="numeric" value="${esc(d.pers)}">
    </section>
    <section class="sect"><span class="eyebrow">Catégorie (facultatif)</span>${catChips("data-fcat", d.cat, false)}
      <span class="status">Si tu ne choisis rien, Claude la devine.</span></section>
    <section class="sect"><span class="eyebrow">L'adapter pour</span>${regimeChips("data-freg", d.reg)}
      <span class="status">« Standard » garde la recette telle quelle. Tu pourras ajouter d'autres régimes ensuite.</span></section>
    <section class="sect">
      ${state.busy ? busyBox("Claude lit et adapte la recette… (jusqu'à une minute)") : `<button class="cta" type="button" data-act="create"${sampleKnown === "none" ? " disabled" : ""}>Créer avec Claude</button>`}
      ${err}
      <span class="status">Chaque recette créée utilise un peu de ton forfait Claude.</span>
    </section>`;
}
function renderListe(){
  const items = shopping();
  const shown = state.vue === "recette" ? store.meals.flatMap(mealItems) : items;
  const total = shown.length, done = shown.filter(i => isDone(i.parts)).length;
  const meals = store.meals.map(m =>
    `<span class="meal">${esc(mealTitle(m))}<button type="button" data-rm="${esc(m.id)}" aria-label="Retirer ce repas">×</button></span>`).join("");
  const groups = state.vue === "recette"
    ? store.meals.map((m, mi) => { const its = mealItems(m); return its.length ? `<div class="rayon"><h3>${esc(mealTitle(m))}</h3><div class="card">${its.map((i,ix) => itemRow(i, "m" + mi + "-" + ix)).join("")}</div></div>` : ""; }).join("")
    : RAYONS.map((ray, ri) => {
        const its = items.filter(i => i.ray === ray).sort(sortRay);
        if (!its.length) return "";
        return `<div class="rayon"><h3>${esc(ray)}</h3><div class="card">${its.map((i,ix) => itemRow(i, "r" + ri + "-" + ix)).join("")}</div></div>`;
      }).join("");
  const toggle = `<div class="chips" role="group" aria-label="Classer la liste">
      <button class="chip" type="button" data-vue="recette" aria-pressed="${state.vue==="recette"}">Par recette</button>
      <button class="chip" type="button" data-vue="rayon" aria-pressed="${state.vue==="rayon"}">Par rayon</button></div>`;
  app.innerHTML = `
    <header class="top"><h1>Liste de courses</h1></header>
    ${!store.meals.length ? `<section class="sect"><div class="empty">Ta liste est vide.<br>Ouvre un plat, choisis le régime et le nombre de personnes, puis touche « Ajouter à la liste de courses ».</div></section>` : `
    <section class="sect"><span class="eyebrow">Repas prévus</span><div class="meals">${meals}</div></section>
    <section class="sect"><span class="eyebrow">Classer la liste</span>${toggle}</section>
    <section class="sect"><div class="bar"><span class="status">${done} sur ${total} articles dans le panier · ${mode==="shared" ? "liste synchronisée" : "liste enregistrée sur cet appareil"}</span></div>
      <div class="bar"><button class="ghost" type="button" data-act="copy">Copier la liste</button>
      <button class="ghost" type="button" data-act="uncheck">Tout décocher</button>
      <button class="ghost danger" type="button" data-act="clear">Vider la liste</button></div>
      ${state.confirmClear ? `<div class="confirm"><span>Retirer tous les repas et articles ?</span><button class="ghost danger" type="button" data-act="clear-yes">Oui, vider</button><button class="ghost" type="button" data-act="clear-no">Annuler</button></div>` : ""}
      ${state.copyText !== null ? `<label class="status" for="copy-box">Sélectionne le texte et copie-le :</label><textarea class="copy" id="copy-box" readonly>${esc(state.copyText)}</textarea>` : ""}
    </section>
    <section class="sect">${groups}</section>`}`;
  const box = document.getElementById("copy-box"); if (box){ box.focus(); box.select(); }
}
function listText(){
  const line = i => "- " + i.n + " : " + fmt(i.q,i.u,true);
  if (state.vue === "recette"){
    return store.meals.map(m => { const its = mealItems(m).filter(i => !isDone(i.parts));
      return its.length ? mealTitle(m).toUpperCase() + "\n" + its.map(line).join("\n") : ""; }).filter(Boolean).join("\n\n");
  }
  const items = shopping();
  return RAYONS.map(ray => { const its = items.filter(i => i.ray === ray && !isDone(i.parts)).sort(sortRay);
    return its.length ? ray.toUpperCase() + "\n" + its.map(line).join("\n") : ""; })
    .filter(Boolean).join("\n\n");
}
let toastTimer;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }
function go(view){ state.view = view; state.err = null; state.confirmDel = false; state.confirmClear = false; state.copyText = null; render(); scrollTo(0,0); }

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el || el.disabled) return;
  if (el.id === "tab-plats"){ if (!state.busy) go("plats"); return; }
  if (el.id === "tab-liste"){ if (!state.busy) go("liste"); return; }
  const d = el.dataset;
  if (d.reg){ state.regime = d.reg; state.err = null; lsSet("regime", d.reg); render(); return; }
  if (d.freg){ state.draft.reg = d.freg; render(); return; }
  if (d.alg){ const a = state.allergies; state.allergies = a.includes(d.alg) ? a.filter(k => k !== d.alg) : [...a, d.alg]; lsSet("allergies", state.allergies); render(); return; }
  if (d.fcat){ state.draft.cat = state.draft.cat === d.fcat ? "" : d.fcat; render(); return; }
  if (d.cat){ state.cat = d.cat; lsSet("cat", d.cat); const g = document.getElementById("grid"); render(); return; }
  if (d.plat){ state.plat = d.plat; go("plat"); return; }
  if (d.go){ if (!state.busy) go(d.go); return; }
  if (d.step){ state.persons = Math.min(12, Math.max(1, state.persons + Number(d.step))); lsSet("persons", state.persons); render(); return; }
  if (d.add){
    const r = getRec(d.add); if (!r) return;
    store.meals = [...store.meals, {id: newId(), rid: d.add, n: state.persons}];
    persist(); render();
    toast("Ajouté : " + platInfo(r.p)[1] + " · " + regLabel(r.r) + " · " + state.persons + " pers.");
    return;
  }
  if (d.vue){ state.vue = d.vue; lsSet("vue", d.vue); state.copyText = null; render(); return; }
  if (d.rm){
    const checked = {}; for (const k in store.checked) if (!k.startsWith(d.rm + "|")) checked[k] = true;
    store.meals = store.meals.filter(m => m.id !== d.rm); store.checked = checked; persist(); render(); return;
  }
  switch (d.act){
    case "new": state.draft.reg = state.regime; go("ajout"); return;
    case "create": createRecipe(); return;
    case "adapt": adaptRecipe(); return;
    case "alg-adapt": adaptAllergies(); return;
    case "alg-open": state.algOpen = !state.algOpen; render(); return;
    case "stop": if (ctl) ctl.abort(); return;
    case "del": state.confirmDel = true; render(); return;
    case "del-no": state.confirmDel = false; render(); return;
    case "del-yes": { const id = state.plat.slice(2); const c = customs.find(x => x.id === id); deleteCustom(id); go("plats"); toast("Recette supprimée" + (c ? " : " + c.nom : "")); return; }
    case "uncheck": store.checked = {}; persist(); render(); return;
    case "clear": state.confirmClear = true; render(); return;
    case "clear-no": state.confirmClear = false; render(); return;
    case "clear-yes": store = {meals:[], checked:{}}; state.confirmClear = false; state.copyText = null; persist(); render(); toast("Liste vidée"); return;
    case "copy": {
      const text = listText();
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => toast("Liste copiée : tu peux la coller dans WhatsApp"), () => { state.copyText = text; render(); });
      } else { state.copyText = text; render(); }
    }
  }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "q"){ state.q = e.target.value; const g = document.getElementById("grid"); if (g) g.innerHTML = platTiles(); return; }
  if (id === "f-nom") state.draft.nom = e.target.value;
  if (id === "f-texte") state.draft.texte = e.target.value;
  if (id === "f-pers") state.draft.pers = e.target.value;
});
document.addEventListener("change", e => {
  if (e.target.id === "hide-alg"){ state.hideAlg = e.target.checked; lsSet("hideAlg", state.hideAlg); render(); return; }
  const k = e.target.dataset && e.target.dataset.chk; if (!k) return;
  const checked = {...store.checked};
  for (const p of k.split("¦")){ if (e.target.checked) checked[p] = true; else delete checked[p]; }
  store.checked = checked; persist(); render();
});
render();
</script>
